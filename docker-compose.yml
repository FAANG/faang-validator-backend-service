# Runs the three pieces of the durable-submission setup together:
#   redis  -> Celery broker + result/state backend
#   api    -> FastAPI (validation + enqueues submission jobs)
#   worker -> Celery worker (runs the long submission jobs)
#
# Validation still happens entirely in `api`. Only submission is handed to
# `worker` via `redis`. No RabbitMQ required.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BIOSAMPLES_MAX_RPS=10
      - BIOSAMPLES_RATE_LIMIT_MAX_RETRIES=5
      - BIOSAMPLES_RATE_LIMIT_MAX_BACKOFF=60
    depends_on:
      redis:
        condition: service_healthy
